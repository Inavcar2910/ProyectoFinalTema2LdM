<svg xmlns="http://www.w3.org/2000/svg" width="280" height="68" viewBox="0 0 280 68">
  <title>Logotipo de PadelPlus</title>
  <!-- Signo más (+) en verde lima detrás a la derecha del icono -->
  <g transform="translate(36, 8)">
    <path d="M13 2 H23 A4 4 0 0 1 27 6 V13 H34 A4 4 0 0 1 38 17 V27 A4 4 0 0 1 34 31 H27 V38 A4 4 0 0 1 23 42 H13 A4 4 0 0 1 9 38 V31 H2 A4 4 0 0 1 -2 27 V17 A4 4 0 0 1 2 13 H9 V6 A4 4 0 0 1 13 2 Z" fill="#0b223c" transform="translate(2, 2)"/>
    <path d="M13 2 H23 A4 4 0 0 1 27 6 V13 H34 A4 4 0 0 1 38 17 V27 A4 4 0 0 1 34 31 H27 V38 A4 4 0 0 1 23 42 H13 A4 4 0 0 1 9 38 V31 H2 A4 4 0 0 1 -2 27 V17 A4 4 0 0 1 2 13 H9 V6 A4 4 0 0 1 13 2 Z" fill="#c8f031" stroke="#12355b" stroke-width="2"/>
  </g>

  <!-- Pala de pádel -->
  <g transform="translate(6, 5)">
    <!-- Cabeza de la pala -->
    <path d="M20 2 C9 2 2 11 2 22 C2 32 9 39 15 45 L17 48 H23 L25 45 C31 39 38 32 38 22 C38 11 31 2 20 2 Z" fill="#12355b" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Puente triangular -->
    <polygon points="16,41 24,41 20,46" fill="#ffffff"/>
    <!-- Puño con cintas de grip -->
    <rect x="17" y="48" width="6" height="13" rx="1.5" fill="#ffffff"/>
    <line x1="17" y1="52" x2="23" y2="50" stroke="#12355b" stroke-width="1.5"/>
    <line x1="17" y1="56" x2="23" y2="54" stroke="#12355b" stroke-width="1.5"/>
    <line x1="17" y1="60" x2="23" y2="58" stroke="#12355b" stroke-width="1.5"/>
    <!-- Agujeros simétricos de la pala -->
    <g fill="#ffffff">
      <circle cx="14" cy="13" r="1.5"/>
      <circle cx="20" cy="13" r="1.5"/>
      <circle cx="26" cy="13" r="1.5"/>
      <circle cx="10" cy="19" r="1.5"/>
      <circle cx="16.5" cy="19" r="1.5"/>
      <circle cx="23.5" cy="19" r="1.5"/>
      <circle cx="30" cy="19" r="1.5"/>
      <circle cx="10" cy="25" r="1.5"/>
      <circle cx="16.5" cy="25" r="1.5"/>
      <circle cx="23.5" cy="25" r="1.5"/>
      <circle cx="30" cy="25" r="1.5"/>
      <circle cx="14" cy="31" r="1.5"/>
      <circle cx="20" cy="31" r="1.5"/>
      <circle cx="26" cy="31" r="1.5"/>
    </g>
  </g>

  <!-- Pelota de pádel con costuras -->
  <g transform="translate(36, 42)">
    <circle cx="10" cy="10" r="8.5" fill="#c8f031" stroke="#ffffff" stroke-width="2"/>
    <path d="M4.5 4.5 Q9 10 4.5 15.5" fill="none" stroke="#12355b" stroke-width="1.6"/>
    <path d="M15.5 4.5 Q11 10 15.5 15.5" fill="none" stroke="#12355b" stroke-width="1.6"/>
  </g>

  <!-- Tipografía principal PADELPLUS -->
  <text x="86" y="41" font-family="Poppins, system-ui, Arial, sans-serif" font-size="29" font-weight="700" letter-spacing="0.5">
    <tspan fill="#ffffff">PADEL</tspan><tspan fill="#c8f031">PLUS</tspan>
  </text>
  <!-- Subtítulo limpio -->
  <text x="87" y="56" font-family="Poppins, system-ui, Arial, sans-serif" font-size="9.5" font-weight="700" letter-spacing="2.8" fill="#dbeafe">
    TIENDA DE PÁDEL
  </text>
</svg>
